<form [formGroup] = "grandparentForm()">

  <div>
    <button
          type="button"
          class="btn "
          data-bs-toggle="modal"
          data-bs-target="#helpModalPages"
        >
          <img width="20" height="20" src="https://img.icons8.com/forma-light/24/info.png" alt="info"/>
        </button>



    <label for="counterPages">Number of pages</label>
    <button type="button" (click)="decrement('pages')">-</button>
    <input type="number" id="counterPages" formControlName= "pages">
    <button type="button" (click)="increment('pages')">+</button>
  </div>


  <div>
    <button
          type="button"
          class="btn "
          data-bs-toggle="modal"
          data-bs-target="#helpModalLanguages"
        >
        <img width="20" height="20" src="https://img.icons8.com/forma-light/24/info.png" alt="info"/>
       </button>

    <label for="counterLanguages">Number of languages</label>
    <button type="button" (click)="decrement('languages')">-</button>
    <input type="number" id="counterLanguages" formControlName = "languages">
    <button type="button" (click)="increment('languages')">+</button>
  </div>


</form>



<div class="modal fade" id="helpModalPages" tabindex="-1" aria-labelledby="helpModalPagesLabel" aria-hidden="true">
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="helpModalPagesLabel">Number of pages</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <p>Add the pages that your project will have. The cost of each page is 30 eur.</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
    </div>
  </div>
</div>
</div>


<div class="modal fade" id="helpModalLanguages" tabindex="-1" aria-labelledby="helpModalLanguagesLabel" aria-hidden="true">
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="helpModalLanguagesLabel">Number of pages</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <p>Add the languages that your project will have. The cost of each language is 30 eur.</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
    </div>
  </div>
</div>
</div>
