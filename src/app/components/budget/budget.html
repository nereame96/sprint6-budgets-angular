
<div class="container text-center">

    <h1 class="rounded ">Get the best quality</h1>


  <form [formGroup]="form">

    <div class="d-flex text-center flex-column gap-3">

      @for (budgetProduct of budgetProducts(); track budgetProduct.id) {
        <app-product-item
        [product]="budgetProduct"
        [parentForm]="form"

        />

      }

    </div>

  </form>

  <p>Total budget: {{sumTotal()}} € </p>

</div>
