<h1>Get the best quality</h1>

<form [formGroup]="form">


  @for (budgetProduct of budgetProducts(); track budgetProduct.id) {
    <label [for]="budgetProduct.id">{{budgetProduct.nameProduct}}</label>
    <input type="checkbox" [formControlName]="budgetProduct.id" [id]="budgetProduct.id"> <br>

  }

</form>

<p>Total budget: {{sumTotal()}} eur </p>
